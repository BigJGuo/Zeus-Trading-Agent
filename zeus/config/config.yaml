trading:
  max_position_pct: 0.20
  max_sector_pct: 0.35
  min_adv_usd: 5_000_000
  min_price: 5.0
  max_price: 2000.0
  max_positions: 20
  min_position_notional: 2000.0
  kelly_fraction: 0.25
  stop_atr_multiple: 2.0
  trailing_activation_pct: 0.02
  trailing_pct: 0.50
  max_hold_days: 15
  signal_entry_threshold: 0.55
  signal_exit_threshold: 0.30
  min_expected_return: 0.005
  min_confidence: 0.45
  max_spread_bps: 50
  broker_buying_power_buffer: 0.05

risk:
  drawdown_l1_usd: 10000
  drawdown_l2_usd: 20000
  drawdown_l3_usd: 35000
  drawdown_l4_usd: 50000
  daily_loss_pause_usd: 3000
  daily_loss_stop_usd: 5000
  max_single_order_notional: 25000
