  max_correlation: 0.75
  ic_degraded_threshold: 0.01
  ic_degraded_days: 5
  model_degraded_size_multiplier: 0.50

models:
  feature_version: "v1"
  training_window_days: 504
  validation_window_days: 63
  retrain_day_of_week: "sunday"
  min_training_samples: 10000
  forward_return_days: 5
  xgb_return:
    n_estimators: 500
    max_depth: 5
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
    random_state: 42
  lgb_direction:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.02
    num_leaves: 31
    random_state: 42

promotion_gates:
  information_coefficient: 0.03
  ic_stability: 0.30
  hit_rate: 0.52
  sharpe_on_signals: 0.80
  max_drawdown_on_signals: -0.25

data:
  universe_refresh_days: 7
  fundamentals_refresh_days: 7
  macro_refresh_days: 7
  lookback_days: 504
  intraday_check_interval_minutes: 15
  quote_cache_ttl_seconds: 5

scheduler:
  after_market_close_hour: 16
  after_market_close_minute: 30
  premarket_hour: 7
  premarket_minute: 0
  heartbeat_interval_minutes: 30

telegram:
  max_messages_per_hour: 30
  heartbeat_interval_minutes: 30
  enabled: true

backtesting:
  commission_per_share: 0.005
  slippage_bps: 10
  initial_capital: 100000.0
  walk_forward_train_months: 18
  walk_forward_test_months: 3
  walk_forward_step_months: 1
